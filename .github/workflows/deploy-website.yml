name: Deploy

on:
  push:
    branches:
      - "main"
    paths:
      - "docs/**"
      - "website/**"
      - ".github/workflows/deploy-website.yml"

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: write # to deploy
    runs-on: ubuntu-latest

    if: github.repository == 'react/metro'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install packages
        uses: ./.github/actions/website-install

      - name: Deploy to GitHub Pages
        working-directory: website
        run: |
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config --global user.name "${GITHUB_ACTOR}"
          echo "machine github.com login ${GITHUB_ACTOR} password ${{ secrets.GITHUB_TOKEN }}" > ~/.netrc
          GIT_USER=${GITHUB_ACTOR} yarn deploy
